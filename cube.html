<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DNS Motorsport Hub</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}

.background{
    position:fixed;
    inset:0;
    z-index:-20;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 20%),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,0.02), transparent 25%),
        linear-gradient(
            135deg,
            rgba(15,15,15,0.45),
            rgba(35,35,35,0.35),
            rgba(15,15,15,0.45)
        );

    background-size:
        400px 400px,
        500px 500px,
        100% 100%;

    animation:carbonMove 30s linear infinite;
}

@keyframes carbonMove{
    from{
        background-position:0 0,0 0,0 0;
    }
    to{
        background-position:400px 200px,-300px 150px,0 0;
    }
}

.light1,
.light2{
    position:fixed;

    width:1200px;
    height:1200px;

    border-radius:50%;

    filter:blur(160px);

    pointer-events:none;
}

.light1{
    background:rgba(0,140,255,0.10);
    z-index:-18;
    animation:moveLight1 14s infinite alternate;
}

.light2{
    background:rgba(255,255,255,0.08);
    z-index:-17;
    animation:moveLight2 18s infinite alternate;
}

@keyframes moveLight1{
    from{
        transform:translate(-400px,-250px);
    }
    to{
        transform:translate(450px,250px);
    }
}

@keyframes moveLight2{
    from{
        transform:translate(500px,-200px);
    }
    to{
        transform:translate(-450px,350px);
    }
}

.logo-bg{
    position:fixed;
    top:50%;
    left:0;
    z-index:-15;
    opacity:0.10;
    pointer-events:none;

    animation:
        logoSlide 40s linear infinite,
        logoGlow 6s ease-in-out infinite;
}

.logo-bg img{
    width:1300px;
    height:auto;
}

@keyframes logoSlide{
    0%{
        transform:
            translateX(120vw)
            translateY(-50%);
    }

    100%{
        transform:
            translateX(-1600px)
            translateY(-50%);
    }
}

@keyframes logoGlow{
    0%,100%{
        filter:drop-shadow(0 0 20px rgba(255,255,255,0.20));
    }

    50%{
        filter:drop-shadow(0 0 70px rgba(255,255,255,0.40));
    }
}

body{
    display:flex;
    justify-content:center;
    align-items:center;

    perspective:7000px;
}

/* LOGO TOP */

.logo{
    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:9999;
}

.logo img{
    width:220px;
    height:auto;
}

/* CUBO */

.cube{
    position:relative;

    width:1100px;
    height:1100px;

    transform-style:preserve-3d;

    animation:cubeRotation 44s infinite ease-in-out;

    will-change:transform;
}

/* FACCE */

.face{
    position:absolute;

    width:1100px;
    height:1100px;

    top:0;
    left:0;

    overflow:hidden;

    backface-visibility:hidden;

    transform-style:preserve-3d;

    will-change:transform;
}

.face iframe{
    width:100%;
    height:100%;

    border:none;
    background:transparent;

    backface-visibility:hidden;
}

/* POSIZIONE FACCE */

.pro{
    transform:
        rotateX(0deg)
        translateZ(550px);
}

.elite{
    transform:
        rotateX(90deg)
        translateZ(550px);
}

.premium{
    transform:
        rotateX(180deg)
        translateZ(550px);
}

.prestige{
    transform:
        rotateX(270deg)
        translateZ(550px);
}

/* ROTAZIONE */

@keyframes cubeRotation{

    0%,22.7%{
        transform:rotateX(0deg);
    }

    25%,47.7%{
        transform:rotateX(-90deg);
    }

    50%,72.7%{
        transform:rotateX(-180deg);
    }

    75%,97.7%{
        transform:rotateX(-270deg);
    }

    100%{
        transform:rotateX(-360deg);
    }
}

</style>
</head>

<body>

<div class="background"></div>

<div class="light1"></div>
<div class="light2"></div>

<div class="logo-bg">
    <img src="dns-logo.png" alt="">
</div>

<div class="logo">
    <img src="dns-logo.png" alt="DNS Motorsport">
</div>

<div class="cube">

    <div class="face pro">
        <iframe src="leaderboard-qualification-pro.html"></iframe>
    </div>

    <div class="face elite">
        <iframe src="leaderboard-qualification-elite.html"></iframe>
    </div>

    <div class="face premium">
        <iframe src="leaderboard-qualification-premiumstreet.html"></iframe>
    </div>

    <div class="face prestige">
        <iframe src="leaderboard-qualification-prestigestreet.html"></iframe>
    </div>

</div>

</body>
</html>
